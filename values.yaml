cpuBurner:
  # -- Deploy the CPU burner Job
  enabled: true

image:
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Uses the chart appVersion when empty.
  tag: "v0.13.0"

fullnameOverride: energy
rbac:
  create: true
service:
  targetPort: http

config:
  log:
    # -- Log level: debug, info, warn or error
    level: debug
    # -- Log format: text or json
    format: text
  host:
    # -- Path to the host sysfs inside the container
    sysfs: /testrootstock
    # -- Path to the host procfs inside the container
    procfs: /proc
  cpu:
    preferredMeters: [hwmon]
  kube:
    podInformer:
      mode: apiserver

prometheus:
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true
  additionalLabels:
    plugin: kube-monitoring
    prometheus: infra-collector
    ccloud/service: kepler
    ccloud/support-group: observability
  rules:
    create: true
    additionalRuleLabels:
      support_group: observability
      service: kepler

perses:
  enabled: true

# Static external-meter DaemonSet (writes a fixed energy value and holds it)
staticEnergy:
  # -- Deploy the static rootstock DaemonSet
  enabled: true
  # -- Fixed value written to hwmon0/energy1_input (µJ). Stays constant until redeployed.
  value: "1000002"

# Ramping external-meter DaemonSet (bumps energy1_input every 5s)
rampEnergy:
  # -- Deploy the ramping rootstock DaemonSet
  enabled: false
