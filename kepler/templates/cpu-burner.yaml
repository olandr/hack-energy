{{- if .Values.cpuBurner.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: cpu-burner
  namespace: {{ include "kepler.namespace" . }}
  labels:
    {{- include "kepler.labels" . | nindent 4 }}
    app.kubernetes.io/component: cpu-burner
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.cpuBurner.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.cpuBurner.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "kepler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cpu-burner
      {{- with .Values.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      containers:
        - name: burner
          image: {{ .Values.image.curlrepo }}
          command: ["/bin/sh", "-c"]
          env:
            - name: WORKERS_PER_CORE
              value: {{ .Values.cpuBurner.workersPerCore | quote }}
            - name: RAMP1_SECONDS
              value: {{ .Values.cpuBurner.ramp1Seconds | quote }}
            - name: HOLD1_SECONDS
              value: {{ .Values.cpuBurner.hold1Seconds | quote }}
            - name: RAMP2_SECONDS
              value: {{ .Values.cpuBurner.ramp2Seconds | quote }}
            - name: HOLD2_SECONDS
              value: {{ .Values.cpuBurner.hold2Seconds | quote }}
          args:
            - |
              set -eu
              pids=""
              trap 'echo stopping; kill $pids 2>/dev/null || true; exit 0' TERM INT

              spawn_worker() {
                sh -c 'while :; do :; done' &
                pids="$pids $!"
              }

              ramp_to() {
                target=$1
                duration=$2
                current=$(echo "$pids" | wc -w)
                to_add=$((target - current))
                [ "$to_add" -le 0 ] && return
                step=$((duration / to_add))
                [ "$step" -lt 1 ] && step=1
                n=1
                while [ "$n" -le "$to_add" ]; do
                  spawn_worker
                  running=$((current + n))
                  echo "workers: $running / $target (~$(awk "BEGIN{printf \"%.2f\", $running/$WORKERS_PER_CORE}") cores)"
                  sleep "$step"
                  n=$((n + 1))
                done
              }

              echo "phase 1: ramp to 1 core over ${RAMP1_SECONDS}s"
              ramp_to $((1 * WORKERS_PER_CORE)) "$RAMP1_SECONDS"
              echo "phase 1: hold at 1 core for ${HOLD1_SECONDS}s"
              sleep "$HOLD1_SECONDS"

              echo "phase 2: ramp to 2 cores over ${RAMP2_SECONDS}s"
              ramp_to $((2 * WORKERS_PER_CORE)) "$RAMP2_SECONDS"
              echo "phase 2: hold at 2 cores for ${HOLD2_SECONDS}s"
              sleep "$HOLD2_SECONDS"

              echo "done, stopping workers"
              kill $pids 2>/dev/null || true
              exit 0
          resources:
            {{- toYaml .Values.cpuBurner.resources | nindent 12 }}
{{- end }}
