{{- if and (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") .Values.prometheus.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "kepler.fullname" . }}
  namespace: {{ include "kepler.namespace" . }}
  labels:
    {{- include "kepler.labels" . | nindent 4 }}
    {{- include "kepler.prometheusLabels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kepler.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ include "kepler.portName" . }}
      interval: {{ .Values.prometheus.podMonitor.interval }}
      path: {{ .Values.prometheus.podMonitor.path }}
      honorLabels: {{ .Values.prometheus.podMonitor.honorLabels }}
      {{- with .Values.prometheus.podMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with .Values.prometheus.podMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prometheus.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
