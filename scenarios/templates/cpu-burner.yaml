{{- if .Values.cpuBurner.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: cpu-burner
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: cpu-burner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.cpuBurner.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.cpuBurner.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cpu-burner
    spec:
      restartPolicy: Never
      containers:
        - name: burner
          image: {{ .Values.image.curlrepo }}
          command: ["/bin/sh", "-c"]
          env:
            - name: WORKERS_PER_CORE
              value: {{ .Values.cpuBurner.workersPerCore | quote }}
            - name: PHASE1_CORES
              value: {{ .Values.cpuBurner.phase1Cores | quote }}
            - name: RAMP1_SECONDS
              value: {{ .Values.cpuBurner.ramp1Seconds | quote }}
            - name: HOLD1_SECONDS
              value: {{ .Values.cpuBurner.hold1Seconds | quote }}
            - name: PHASE2_CORES
              value: {{ .Values.cpuBurner.phase2Cores | quote }}
            - name: RAMP2_SECONDS
              value: {{ .Values.cpuBurner.ramp2Seconds | quote }}
            - name: HOLD2_SECONDS
              value: {{ .Values.cpuBurner.hold2Seconds | quote }}
          args:
            - |
              set -eu
              pids=""
              trap 'echo stopping; kill $pids 2>/dev/null || true; exit 0' TERM INT

              spawn_worker() {
                sh -c '
                  # Burn real CPU time: tight loop doing dense integer math.
                  # Each iteration performs many arithmetic ops so the process
                  # spends its time computing rather than idling on shell parsing.
                  a=1
                  b=2
                  c=3
                  while :; do
                    n=0
                    while [ "$n" -lt 2000 ]; do
                      a=$(((a * 1103515245 + 12345) % 2147483647))
                      b=$(((b ^ (a << 3)) + (a >> 2)))
                      c=$(((c * 31 + b) % 2147483647))
                      a=$(((a + b + c) % 2147483647))
                      b=$(((b * a + 7919) % 2147483647))
                      c=$(((c ^ b) + (a * 131))) 
                      n=$((n + 1))
                    done
                  done
                ' &
                pids="$pids $!"
              }

              ramp_to() {
                target=$1
                duration=$2
                current=$(echo "$pids" | wc -w)
                to_add=$((target - current))
                [ "$to_add" -le 0 ] && return
                step=$((duration / to_add))
                [ "$step" -lt 1 ] && step=1
                n=1
                while [ "$n" -le "$to_add" ]; do
                  spawn_worker
                  running=$((current + n))
                  echo "workers: $running / $target (~$(awk "BEGIN{printf \"%.2f\", $running/$WORKERS_PER_CORE}") cores)"
                  sleep "$step"
                  n=$((n + 1))
                done
              }

              echo "phase 1: ramp to ${PHASE1_CORES} core(s) over ${RAMP1_SECONDS}s"
              ramp_to $((PHASE1_CORES * WORKERS_PER_CORE)) "$RAMP1_SECONDS"
              echo "phase 1: hold at ${PHASE1_CORES} core(s) for ${HOLD1_SECONDS}s"
              sleep "$HOLD1_SECONDS"

              echo "phase 2: ramp to ${PHASE2_CORES} core(s) over ${RAMP2_SECONDS}s"
              ramp_to $((PHASE2_CORES * WORKERS_PER_CORE)) "$RAMP2_SECONDS"
              echo "phase 2: hold at ${PHASE2_CORES} core(s) for ${HOLD2_SECONDS}s"
              sleep "$HOLD2_SECONDS"

              echo "done, stopping workers"
              kill $pids 2>/dev/null || true
              exit 0
          resources:
            {{- toYaml .Values.cpuBurner.resources | nindent 12 }}
{{- end }}
